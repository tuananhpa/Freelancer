name: Deploy Backend to VM

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  # ─── JOB 1: Build trên GitHub hosted runner (không giới hạn disk) ───
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER}/uranus-backend" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── JOB 2: Deploy trên server (chỉ pull image, không build) ───
  deploy:
    runs-on: self-hosted
    needs: build-and-push
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show disk usage
        run: df -h || true

      - name: Prune old Docker resources
        run: |
          docker system prune -af || true
          df -h || true

      - name: Log in to GHCR and pull image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ${{ env.IMAGE }}:latest
          docker tag ${{ env.IMAGE }}:latest uranus-backend:latest

      - name: Copy compose files and restart backend
        run: |
          rm -rf $HOME/uranus/URANUS-BackEnd
          mkdir -p $HOME/uranus/URANUS-BackEnd
          cp -r . $HOME/uranus/URANUS-BackEnd/

          cd $HOME/uranus
          docker compose up -d --no-build backend
          echo "=== Backend deployed successfully ==="
          docker ps --filter "name=uranus_backend" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
