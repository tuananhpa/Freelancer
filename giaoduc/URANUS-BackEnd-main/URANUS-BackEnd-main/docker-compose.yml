services:
  postgres:
    image: postgres:15-alpine
    container_name: uranus_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: uranus_lms
      POSTGRES_USER: uranus
      POSTGRES_PASSWORD: uranus_secret
    ports:
      - "5432:5432"
    volumes:
      - uranus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uranus -d uranus_lms"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uranus_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - uranus_redisdata:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: uranus_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  uranus_pgdata:
    driver: local
  uranus_redisdata:
    driver: local
