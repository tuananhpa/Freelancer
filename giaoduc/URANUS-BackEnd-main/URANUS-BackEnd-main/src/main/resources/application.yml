server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-http-form-post-size: 1GB
    max-swallow-size: 1GB

spring:
  application:
    name: uranus-lms
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
  codec:
    max-in-memory-size: 1GB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uranus_lms}
    username: ${DB_USERNAME:uranus}
    password: ${DB_PASSWORD:uranus_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "1"
    validate-on-migrate: false
    ignore-migration-patterns: "*:missing"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Ho_Chi_Minh

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  amqp:
    deserialization:
      trust:
        all: true

logging:
  level:
    com.uranus: DEBUG
    org.springframework.security: WARN

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}       # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days

  frontend:
    url: ${FRONTEND_URL:https://uranuscenter.com}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,https://uranuscenter.com,https://www.uranuscenter.com}

  google:
    client-id: ${GOOGLE_CLIENT_ID:268507710666-pgd45otcd8dh4sliu6eu7is4vbmabkjb.apps.googleusercontent.com}
    
  support:
    # So hoi thoai moi toi da tren mot IP trong mot gio.
    # Dem theo IP nen nhieu nguoi sau cung mot NAT dung chung han muc; nang len
    # neu khach that bi chan nham.
    max-new-conversations-per-hour: ${SUPPORT_MAX_NEW_CONVERSATIONS_PER_HOUR:10}

  teacher:
    secret-code: ${TEACHER_SECRET_CODE:URANUS_TEACHER_2026}

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:dlw6jmsyf}
    api-key: ${CLOUDINARY_API_KEY:345882647239966}
    api-secret: ${CLOUDINARY_API_SECRET:otltJttDEOtTd3eRvV3IxbcCKaY}
