<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2e14">
<title>Phát thanh nội bộ</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <aside class="nav" id="nav" aria-label="Menu chính">
    <a class="brand" href="#/">
      <img src="icon.svg" alt="" width="34" height="34">
      <span class="brand-t"><b>Phát thanh nội bộ</b><small>Tổ phát thanh</small></span>
    </a>
    <nav class="nav-links" id="navLinks"></nav>
    <div class="nav-foot"><span id="engine" class="engine" role="status"></span></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="main">
    <header class="bar">
      <button class="burger" id="burger" aria-label="Thu gọn hoặc mở menu" aria-controls="nav" aria-expanded="true">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="crumbs" id="crumbs"></div>
      <div class="bar-act" id="barAct"></div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="modal"><div id="modalBody"></div></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
