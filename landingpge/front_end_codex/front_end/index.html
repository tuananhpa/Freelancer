<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#294b35" />
    <script>
      try {
        const theme =
          localStorage.getItem("hytales.theme") === "night" ? "night" : "day";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme =
          theme === "night" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "day";
      }
    </script>
    <meta
      name="description"
      content="HYTales – Chạm mã QR, mở câu chuyện quê. Khám phá nông sản, con người và di sản Hưng Yên qua những thước phim và hộ chiếu di sản số."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/noto-serif-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/noto-serif-vietnamese.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>HYTales | Chạm mã QR – Mở câu chuyện quê</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
